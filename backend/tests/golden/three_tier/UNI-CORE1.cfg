!
! UNI-CORE1 | role core | site Uni | generated by NetArchitect
!
hostname UNI-CORE1
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
ip routing
!
!
spanning-tree mode rapid-pvst
!
interface Loopback0
 description Router ID
 ip address 10.30.2.12 255.255.255.255
!
interface TenGigabitEthernet1/0/1
 description to ADMIN-DIST1 TenGigabitEthernet1/0/1 [10GBASE-T]
 no switchport
 ip address 10.30.2.1 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface TenGigabitEthernet1/0/2
 description to LIB-DIST1 TenGigabitEthernet1/0/1 [10GBASE-T]
 no switchport
 ip address 10.30.2.5 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface TenGigabitEthernet1/0/3
 description to ENG-DIST1 TenGigabitEthernet1/0/1 [10GBASE-SR]
 no switchport
 ip address 10.30.2.3 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface TenGigabitEthernet1/0/4
 description to SCI-DIST1 TenGigabitEthernet1/0/1 [10GBASE-LR]
 no switchport
 ip address 10.30.2.7 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
router ospf 1
 router-id 10.30.2.12
 auto-cost reference-bandwidth 100000
 area 0 authentication message-digest
 passive-interface Loopback0
 network 10.30.2.12 0.0.0.0 area 0
 network 10.30.2.1 0.0.0.0 area 0
 network 10.30.2.5 0.0.0.0 area 0
 network 10.30.2.3 0.0.0.0 area 0
 network 10.30.2.7 0.0.0.0 area 0
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
