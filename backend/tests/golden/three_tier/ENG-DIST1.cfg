!
! ENG-DIST1 | role distribution | site Uni | generated by NetArchitect
!
hostname ENG-DIST1
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
ip routing
!
vlan 30
 name ENG-USERS
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
spanning-tree vlan 30 root primary
!
interface Loopback0
 description Router ID
 ip address 10.30.2.9 255.255.255.255
!
interface TenGigabitEthernet1/0/1
 description to UNI-CORE1 TenGigabitEthernet1/0/3 [10GBASE-SR]
 no switchport
 ip address 10.30.2.2 255.255.255.254
 no shutdown
!
interface TenGigabitEthernet1/0/2
 description to ENG-ACC1 TenGigabitEthernet1/1/1 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 30
 no shutdown
!
interface Vlan30
 description Gateway Eng-Users
 ip address 10.30.0.129 255.255.255.128
 no shutdown
!
router ospf 1
 router-id 10.30.2.9
 auto-cost reference-bandwidth 100000
 passive-interface Loopback0
 passive-interface Vlan30
 network 10.30.2.9 0.0.0.0 area 0
 network 10.30.2.2 0.0.0.0 area 0
 network 10.30.0.129 0.0.0.0 area 0
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
