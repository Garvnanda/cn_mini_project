!
! LIB-ACC1 | role access | site Uni | generated by NetArchitect
!
hostname LIB-ACC1
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
vlan 20
 name LIB-USERS
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
!
interface range GigabitEthernet1/0/1 - 48
 description Lib-Users (user)
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range GigabitEthernet2/0/1 - 48
 description Lib-Users (user)
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range GigabitEthernet3/0/1 - 4
 description Lib-Users (user)
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range GigabitEthernet3/0/5 - 48
 description unused
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface TenGigabitEthernet1/1/1
 description to LIB-DIST1 TenGigabitEthernet1/0/2 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 20
 no shutdown
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
