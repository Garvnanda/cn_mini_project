!
! LIB-DIST1 | role distribution | site Uni | generated by NetArchitect
!
hostname LIB-DIST1
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
ip routing
!
vlan 20
 name LIB-USERS
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
spanning-tree vlan 20 root primary
!
interface Loopback0
 description Router ID
 ip address 10.30.2.10 255.255.255.255
!
interface TenGigabitEthernet1/0/1
 description to UNI-CORE1 TenGigabitEthernet1/0/2 [10GBASE-T]
 no switchport
 ip address 10.30.2.4 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface TenGigabitEthernet1/0/2
 description to LIB-ACC1 TenGigabitEthernet1/1/1 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 20
 no shutdown
!
interface Vlan20
 description Gateway Lib-Users
 ip address 10.30.1.1 255.255.255.128
 no shutdown
!
router ospf 1
 router-id 10.30.2.10
 auto-cost reference-bandwidth 100000
 area 0 authentication message-digest
 passive-interface Loopback0
 passive-interface Vlan20
 network 10.30.2.10 0.0.0.0 area 0
 network 10.30.2.4 0.0.0.0 area 0
 network 10.30.1.1 0.0.0.0 area 0
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
