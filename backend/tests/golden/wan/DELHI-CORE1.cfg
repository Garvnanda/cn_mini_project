!
! DELHI-CORE1 | role core | site Delhi | generated by NetArchitect
!
hostname DELHI-CORE1
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
ip routing
!
vlan 10
 name DELHI-IOT
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10 root primary
!
interface Loopback0
 description Router ID
 ip address 10.0.4.10 255.255.255.255
!
interface TenGigabitEthernet1/0/1
 description to DELHI-ACC1 TenGigabitEthernet1/1/1 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10
 no shutdown
!
interface TenGigabitEthernet1/0/2
 description to DELHI-ACC2 TenGigabitEthernet1/1/1 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10
 no shutdown
!
interface TenGigabitEthernet1/0/3
 description to DELHI-R1 TenGigabitEthernet0/0/0 [10GBASE-T]
 no switchport
 ip address 10.0.4.7 255.255.255.254
 no shutdown
!
interface Vlan10
 description Gateway Delhi-IoT
 ip address 10.0.0.1 255.255.252.0
 no shutdown
!
router ospf 1
 router-id 10.0.4.10
 auto-cost reference-bandwidth 100000
 passive-interface Loopback0
 passive-interface Vlan10
 network 10.0.4.10 0.0.0.0 area 0
 network 10.0.4.7 0.0.0.0 area 0
 network 10.0.0.1 0.0.0.0 area 0
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
