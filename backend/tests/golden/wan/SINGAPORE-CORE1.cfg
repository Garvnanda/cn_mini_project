!
! SINGAPORE-CORE1 | role core | site Singapore | generated by NetArchitect
!
hostname SINGAPORE-CORE1
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
ip routing
!
vlan 40
 name SG-IOT
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
spanning-tree vlan 40 root primary
!
interface Loopback0
 description Router ID
 ip address 10.0.18.2 255.255.255.255
!
interface TenGigabitEthernet1/0/1
 description to SINGAPORE-ACC1 TenGigabitEthernet1/1/1 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 40
 no shutdown
!
interface TenGigabitEthernet1/0/2
 description to SINGAPORE-ACC2 TenGigabitEthernet1/1/1 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 40
 no shutdown
!
interface TenGigabitEthernet1/0/3
 description to SINGAPORE-R1 TenGigabitEthernet0/0/0 [10GBASE-T]
 no switchport
 ip address 10.0.18.1 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface Vlan40
 description Gateway Sg-IoT
 ip address 10.0.16.1 255.255.254.0
 no shutdown
!
router ospf 1
 router-id 10.0.18.2
 auto-cost reference-bandwidth 100000
 area 3 authentication message-digest
 passive-interface Loopback0
 passive-interface Vlan40
 network 10.0.18.2 0.0.0.0 area 3
 network 10.0.18.1 0.0.0.0 area 3
 network 10.0.16.1 0.0.0.0 area 3
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
