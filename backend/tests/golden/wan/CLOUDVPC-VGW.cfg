!
! CLOUDVPC-VGW | role cloud | site CloudVPC | generated by NetArchitect
!
hostname CLOUDVPC-VGW
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
!
crypto isakmp key CHANGE_ME_PSK address 203.0.113.0
!
crypto ipsec transform-set TS-AES256 esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile VTI-PROFILE
 set transform-set TS-AES256
!
interface Loopback0
 description Router ID
 ip address 10.0.21.0 255.255.255.255
!
interface TenGigabitEthernet0/0/0
 description VPC subnet VPC-Apps
 ip address 10.0.20.1 255.255.255.0
 no shutdown
!
interface TenGigabitEthernet0/0/1
 description to DELHI-R1 TenGigabitEthernet0/0/4 [10GBASE-T]
 ip address 203.0.113.1 255.255.255.254
 no shutdown
!
interface Tunnel1
 description IPsec to DELHI-R1
 ip address 10.0.4.3 255.255.255.254
 tunnel source TenGigabitEthernet0/0/1
 tunnel destination 203.0.113.0
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile VTI-PROFILE
 no shutdown
!
router bgp 65100
 bgp router-id 10.0.21.0
 neighbor 10.0.4.2 remote-as 65000
 network 10.0.21.0 mask 255.255.255.255
 network 10.0.20.0 mask 255.255.255.0
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
