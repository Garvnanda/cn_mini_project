!
! SINGAPORE-R1 | role router | site Singapore | generated by NetArchitect
!
hostname SINGAPORE-R1
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
!
crypto isakmp key CHANGE_ME_PSK address 203.0.113.2
!
crypto ipsec transform-set TS-AES256 esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile VTI-PROFILE
 set transform-set TS-AES256
!
interface Loopback0
 description Router ID
 ip address 10.0.18.3 255.255.255.255
!
interface TenGigabitEthernet0/0/0
 description to SINGAPORE-CORE1 TenGigabitEthernet1/0/3 [10GBASE-T]
 ip address 10.0.18.0 255.255.255.254
 no shutdown
!
interface TenGigabitEthernet0/0/1
 description to DELHI-R1 TenGigabitEthernet0/0/3 [10GBASE-T]
 ip address 203.0.113.3 255.255.255.254
 no shutdown
!
interface Tunnel1
 description IPsec to DELHI-R1
 ip address 10.0.4.1 255.255.255.254
 tunnel source TenGigabitEthernet0/0/1
 tunnel destination 203.0.113.2
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile VTI-PROFILE
 no shutdown
!
router ospf 1
 router-id 10.0.18.3
 auto-cost reference-bandwidth 100000
 passive-interface Loopback0
 network 10.0.18.3 0.0.0.0 area 3
 network 10.0.18.0 0.0.0.0 area 3
 network 10.0.4.1 0.0.0.0 area 0
 area 3 range 10.0.16.0 255.255.252.0
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
