!
! HQ-R1 | role router | site HQ | generated by NetArchitect
!
hostname HQ-R1
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
class-map match-any REALTIME
 match dscp ef
!
policy-map WAN-EDGE
 class REALTIME
  priority percent 30
 class class-default
  fair-queue
!
interface Loopback0
 description Router ID
 ip address 10.20.1.144 255.255.255.255
!
interface TenGigabitEthernet0/0/0
 description to HQ-CORE1 TenGigabitEthernet1/0/4 [10GBASE-T]
 ip address 10.20.1.134 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface TenGigabitEthernet0/0/1
 description to BRANCH-R1 TenGigabitEthernet0/0/2 [10GBASE-ER]
 ip address 10.20.1.130 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 service-policy output WAN-EDGE
 no shutdown
!
interface TenGigabitEthernet0/0/2
 description to COLO-R1 TenGigabitEthernet0/0/1 [10GBASE-ER]
 ip address 10.20.1.132 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 service-policy output WAN-EDGE
 no shutdown
!
router ospf 1
 router-id 10.20.1.144
 auto-cost reference-bandwidth 100000
 area 0 authentication message-digest
 passive-interface Loopback0
 network 10.20.1.144 0.0.0.0 area 0
 network 10.20.1.134 0.0.0.0 area 0
 network 10.20.1.130 0.0.0.0 area 0
 network 10.20.1.132 0.0.0.0 area 0
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
