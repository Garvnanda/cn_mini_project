!
! COLO-R2 | role router | site Colo | generated by NetArchitect
!
hostname COLO-R2
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
interface Loopback0
 description Router ID
 ip address 10.20.3.201 255.255.255.255
!
interface TenGigabitEthernet0/0/0
 description to COLO-CORE2 TenGigabitEthernet1/0/4 [10GBASE-T]
 ip address 10.20.3.196 255.255.255.254
 no shutdown
!
interface TenGigabitEthernet0/0/1
 description to HQ-R2 TenGigabitEthernet0/0/2 [10GBASE-ER]
 ip address 10.20.1.139 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 10.20.3.201
 auto-cost reference-bandwidth 100000
 passive-interface Loopback0
 network 10.20.3.201 0.0.0.0 area 2
 network 10.20.3.196 0.0.0.0 area 2
 network 10.20.1.139 0.0.0.0 area 0
 area 2 range 10.20.3.0 255.255.255.0
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
