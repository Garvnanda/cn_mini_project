!
! COLO-CORE1 | role core | site Colo | generated by NetArchitect
!
hostname COLO-CORE1
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
ip routing
!
vlan 210
 name COLO-OPS
vlan 220
 name COLO-TRADING
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
spanning-tree vlan 210,220 root primary
!
interface Loopback0
 description Router ID
 ip address 10.20.3.198 255.255.255.255
!
interface TenGigabitEthernet1/0/1
 description to COLO-CORE2 TenGigabitEthernet1/0/1 [10GBASE-T]
 no switchport
 ip address 10.20.3.192 255.255.255.254
 no shutdown
!
interface TenGigabitEthernet1/0/2
 description to COLO-CORE2 TenGigabitEthernet1/0/2 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 210,220
 no shutdown
!
interface TenGigabitEthernet1/0/3
 description to COLO-ACC1 TenGigabitEthernet1/1/1 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 210,220
 no shutdown
!
interface TenGigabitEthernet1/0/4
 description to COLO-R1 TenGigabitEthernet0/0/0 [10GBASE-T]
 no switchport
 ip address 10.20.3.195 255.255.255.254
 no shutdown
!
interface Vlan210
 description Gateway Colo-Ops
 ip address 10.20.3.2 255.255.255.128
 standby version 2
 standby 210 ip 10.20.3.1
 standby 210 priority 110
 standby 210 preempt
 no shutdown
!
interface Vlan220
 description Gateway Colo-Trading
 ip address 10.20.3.130 255.255.255.192
 standby version 2
 standby 220 ip 10.20.3.129
 standby 220 priority 110
 standby 220 preempt
 no shutdown
!
router ospf 1
 router-id 10.20.3.198
 auto-cost reference-bandwidth 100000
 passive-interface Loopback0
 passive-interface Vlan210
 passive-interface Vlan220
 network 10.20.3.198 0.0.0.0 area 2
 network 10.20.3.192 0.0.0.0 area 2
 network 10.20.3.195 0.0.0.0 area 2
 network 10.20.3.2 0.0.0.0 area 2
 network 10.20.3.130 0.0.0.0 area 2
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
