!
! HQ-CORE2 | role core | site HQ | generated by NetArchitect
!
hostname HQ-CORE2
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
ip routing
!
vlan 10
 name HQ-USERS
vlan 20
 name HQ-TRADING
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20 root secondary
!
interface Loopback0
 description Router ID
 ip address 10.20.1.79 255.255.255.255
!
interface TenGigabitEthernet1/0/1
 description to HQ-CORE1 TenGigabitEthernet1/0/1 [10GBASE-T]
 no switchport
 ip address 10.20.1.65 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface TenGigabitEthernet1/0/2
 description to HQ-CORE1 TenGigabitEthernet1/0/2 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20
 no shutdown
!
interface TenGigabitEthernet1/0/3
 description to HQ-ACC1 TenGigabitEthernet1/1/2 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20
 no shutdown
!
interface TenGigabitEthernet1/0/4
 description to HQ-R2 TenGigabitEthernet0/0/0 [10GBASE-T]
 no switchport
 ip address 10.20.1.77 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface Vlan10
 description Gateway HQ-Users
 ip address 10.20.0.3 255.255.255.0
 standby version 2
 standby 10 ip 10.20.0.1
 standby 10 priority 100
 standby 10 preempt
 no shutdown
!
interface Vlan20
 description Gateway HQ-Trading
 ip address 10.20.1.3 255.255.255.192
 standby version 2
 standby 20 ip 10.20.1.1
 standby 20 priority 100
 standby 20 preempt
 no shutdown
!
router ospf 1
 router-id 10.20.1.79
 auto-cost reference-bandwidth 100000
 area 0 authentication message-digest
 passive-interface Loopback0
 passive-interface Vlan10
 passive-interface Vlan20
 network 10.20.1.79 0.0.0.0 area 0
 network 10.20.1.65 0.0.0.0 area 0
 network 10.20.1.77 0.0.0.0 area 0
 network 10.20.0.3 0.0.0.0 area 0
 network 10.20.1.3 0.0.0.0 area 0
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
