 description to BRANCH1-R1 TenGigabitEthernet0/0/3 [10GBASE-ER]
 ip address 10.20.1.72 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface TenGigabitEthernet0/0/2
 description to BRANCH2-R1 TenGigabitEthernet0/0/3 [10GBASE-T]
 ip address 10.20.1.74 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
router ospf 1
 router-id 10.20.1.81
 auto-cost reference-bandwidth 100000
 area 0 authentication message-digest
 passive-interface Loopback0
 network 10.20.1.81 0.0.0.0 area 0
 network 10.20.1.76 0.0.0.0 area 0
 network 10.20.1.72 0.0.0.0 area 0
 network 10.20.1.74 0.0.0.0 area 0
