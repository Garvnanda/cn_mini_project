!
! BRANCH2-CORE2 | role core | site Branch2 | generated by NetArchitect
!
hostname BRANCH2-CORE2
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
ip routing
!
vlan 210
 name B2-USERS
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
spanning-tree vlan 210 root secondary
!
ip access-list extended ACL-B2-USERS-IN
 permit tcp 10.20.3.0 0.0.0.127 10.20.1.0 0.0.0.63 eq 443
 deny ip 10.20.3.0 0.0.0.127 10.20.1.0 0.0.0.63
 permit ip any any
!
interface Loopback0
 description Router ID
 ip address 10.20.3.135 255.255.255.255
!
interface TenGigabitEthernet1/0/1
 description to BRANCH2-CORE1 TenGigabitEthernet1/0/1 [10GBASE-T]
 no switchport
 ip address 10.20.3.129 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface TenGigabitEthernet1/0/2
 description to BRANCH2-CORE1 TenGigabitEthernet1/0/2 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 210
 no shutdown
!
interface TenGigabitEthernet1/0/3
 description to BRANCH2-ACC1 TenGigabitEthernet1/1/2 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 210
 no shutdown
!
interface TenGigabitEthernet1/0/4
 description to BRANCH2-R1 TenGigabitEthernet0/0/1 [10GBASE-T]
 no switchport
 ip address 10.20.3.133 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface Vlan210
 description Gateway B2-Users
 ip address 10.20.3.3 255.255.255.128
 standby version 2
 standby 210 ip 10.20.3.1
 standby 210 priority 100
 standby 210 preempt
 ip access-group ACL-B2-USERS-IN in
 no shutdown
!
router ospf 1
 router-id 10.20.3.135
 auto-cost reference-bandwidth 100000
 area 2 authentication message-digest
 passive-interface Loopback0
 passive-interface Vlan210
 network 10.20.3.135 0.0.0.0 area 2
 network 10.20.3.129 0.0.0.0 area 2
 network 10.20.3.133 0.0.0.0 area 2
 network 10.20.3.3 0.0.0.0 area 2
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
