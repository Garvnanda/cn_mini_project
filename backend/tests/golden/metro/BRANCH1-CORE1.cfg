 description to BRANCH1-CORE2 TenGigabitEthernet1/0/1 [10GBASE-T]
 no switchport
 ip address 10.20.2.128 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface TenGigabitEthernet1/0/2
 description to BRANCH1-CORE2 TenGigabitEthernet1/0/2 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 110
 no shutdown
!
interface TenGigabitEthernet1/0/3
 description to BRANCH1-ACC1 TenGigabitEthernet1/1/1 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 110
 no shutdown
!
interface TenGigabitEthernet1/0/4
 description to BRANCH1-R1 TenGigabitEthernet0/0/0 [10GBASE-T]
 no switchport
 ip address 10.20.2.131 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface Vlan110
 description Gateway B1-Users
 ip address 10.20.2.2 255.255.255.128
 standby version 2
 standby 110 ip 10.20.2.1
 standby 110 priority 110
 standby 110 preempt
 no shutdown
!
router ospf 1
 router-id 10.20.2.134
 auto-cost reference-bandwidth 100000
 area 1 authentication message-digest
 passive-interface Loopback0
 passive-interface Vlan110
 network 10.20.2.134 0.0.0.0 area 1
 network 10.20.2.128 0.0.0.0 area 1
 network 10.20.2.131 0.0.0.0 area 1
 network 10.20.2.2 0.0.0.0 area 1
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
