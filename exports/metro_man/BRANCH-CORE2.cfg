!
! BRANCH-CORE2 | role core | site Branch | generated by NetArchitect
!
hostname BRANCH-CORE2
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
ip routing
!
vlan 110
 name BRANCH-USERS
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
spanning-tree vlan 110 root secondary
!
ip access-list extended ACL-BRANCH-USERS-IN
 permit tcp 10.20.2.0 0.0.0.127 10.20.3.128 0.0.0.63 eq 443
 deny ip 10.20.2.0 0.0.0.127 10.20.3.128 0.0.0.63
 permit ip any any
!
interface Loopback0
 description Router ID
 ip address 10.20.2.135 255.255.255.255
!
interface TenGigabitEthernet1/0/1
 description to BRANCH-CORE1 TenGigabitEthernet1/0/1 [10GBASE-T]
 no switchport
 ip address 10.20.2.129 255.255.255.254
 no shutdown
!
interface TenGigabitEthernet1/0/2
 description to BRANCH-CORE1 TenGigabitEthernet1/0/2 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 110
 no shutdown
!
interface TenGigabitEthernet1/0/3
 description to BRANCH-ACC1 TenGigabitEthernet1/1/2 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 110
 no shutdown
!
interface TenGigabitEthernet1/0/4
 description to BRANCH-R1 TenGigabitEthernet0/0/1 [10GBASE-T]
 no switchport
 ip address 10.20.2.133 255.255.255.254
 no shutdown
!
interface Vlan110
 description Gateway Branch-Users
 ip address 10.20.2.3 255.255.255.128
 standby version 2
 standby 110 ip 10.20.2.1
 standby 110 priority 100
 standby 110 preempt
 ip access-group ACL-BRANCH-USERS-IN in
 no shutdown
!
router ospf 1
 router-id 10.20.2.135
 auto-cost reference-bandwidth 100000
 passive-interface Loopback0
 passive-interface Vlan110
 network 10.20.2.135 0.0.0.0 area 1
 network 10.20.2.129 0.0.0.0 area 1
 network 10.20.2.133 0.0.0.0 area 1
 network 10.20.2.3 0.0.0.0 area 1
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
