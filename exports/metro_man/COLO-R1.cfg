!
! COLO-R1 | role router | site Colo | generated by NetArchitect
!
hostname COLO-R1
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
class-map match-any REALTIME
 match dscp ef
!
policy-map WAN-EDGE
 class REALTIME
  priority percent 30
 class class-default
  fair-queue
!
interface Loopback0
 description Router ID
 ip address 10.20.3.200 255.255.255.255
!
interface TenGigabitEthernet0/0/0
 description to COLO-CORE1 TenGigabitEthernet1/0/4 [10GBASE-T]
 ip address 10.20.3.194 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface TenGigabitEthernet0/0/1
 description to HQ-R1 TenGigabitEthernet0/0/2 [10GBASE-ER]
 ip address 10.20.1.133 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 service-policy output WAN-EDGE
 no shutdown
!
router ospf 1
 router-id 10.20.3.200
 auto-cost reference-bandwidth 100000
 area 0 authentication message-digest
 area 2 authentication message-digest
 passive-interface Loopback0
 network 10.20.3.200 0.0.0.0 area 2
 network 10.20.3.194 0.0.0.0 area 2
 network 10.20.1.133 0.0.0.0 area 0
 area 2 range 10.20.3.0 255.255.255.0
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
