!
! COLO-ACC1 | role access | site Colo | generated by NetArchitect
!
hostname COLO-ACC1
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
vlan 210
 name COLO-OPS
vlan 220
 name COLO-TRADING
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
!
interface range GigabitEthernet1/0/1 - 48
 description Colo-Ops (user)
 switchport mode access
 switchport access vlan 210
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range GigabitEthernet2/0/1 - 32
 description Colo-Ops (user)
 switchport mode access
 switchport access vlan 210
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range GigabitEthernet2/0/33 - 48
 description Colo-Trading (server)
 switchport mode access
 switchport access vlan 220
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range GigabitEthernet3/0/1 - 24
 description Colo-Trading (server)
 switchport mode access
 switchport access vlan 220
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range GigabitEthernet3/0/25 - 48
 description unused
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface TenGigabitEthernet1/1/1
 description to COLO-CORE1 TenGigabitEthernet1/0/3 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 210,220
 no shutdown
!
interface TenGigabitEthernet1/1/2
 description to COLO-CORE2 TenGigabitEthernet1/0/3 [10GBASE-T]
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 210,220
 no shutdown
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
