!
! MUMBAI-R1 | role router | site Mumbai | generated by NetArchitect
!
hostname MUMBAI-R1
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
interface Loopback0
 description Router ID
 ip address 10.100.10.3 255.255.255.255
!
interface TenGigabitEthernet0/0/0
 description to MUMBAI-CORE1 TenGigabitEthernet1/0/3 [10GBASE-T]
 ip address 10.100.10.0 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
interface TenGigabitEthernet0/0/1
 description to DELHI-R1 TenGigabitEthernet0/0/1 [10GBASE-T]
 ip address 10.100.4.9 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
router ospf 1
 router-id 10.100.10.3
 auto-cost reference-bandwidth 100000
 area 0 authentication message-digest
 area 1 authentication message-digest
 passive-interface Loopback0
 network 10.100.10.3 0.0.0.0 area 1
 network 10.100.10.0 0.0.0.0 area 1
 network 10.100.4.9 0.0.0.0 area 0
 area 1 range 10.100.8.0 255.255.252.0
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
