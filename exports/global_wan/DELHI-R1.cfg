!
! DELHI-R1 | role router | site Delhi | generated by NetArchitect
!
hostname DELHI-R1
!
service password-encryption
no ip domain-lookup
ip domain-name netarch.local
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
crypto key generate rsa modulus 2048
ip ssh version 2
banner motd ^Authorized access only^
!
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
!
crypto isakmp key CHANGE_ME_PSK address 203.0.113.3
crypto isakmp key CHANGE_ME_PSK address 203.0.113.1
!
crypto ipsec transform-set TS-AES256 esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile VTI-PROFILE
 set transform-set TS-AES256
!
interface Loopback0
 description Router ID
 ip address 10.100.4.11 255.255.255.255
!
interface TenGigabitEthernet0/0/0
 description to DELHI-CORE1 TenGigabitEthernet1/0/3 [10GBASE-T]
 ip address 10.100.4.6 255.255.255.254
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
 no shutdown
!
