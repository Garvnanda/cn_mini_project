 tunnel source TenGigabitEthernet0/0/3
 tunnel destination 203.0.113.3
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile VTI-PROFILE
 no shutdown
!
interface TenGigabitEthernet0/0/4
 description to CLOUDVPC-VGW TenGigabitEthernet0/0/1 [10GBASE-T]
 ip address 203.0.113.0 255.255.255.254
 no shutdown
